<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Skyline — Invest With Clarity</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
</head>
<body>

<div class="sky-wrap">

  <!-- ============================================================
       BRAND — SVG monogram + wordmark (top)
       ============================================================ -->
  <div class="sky-brand">
    <div class="sky-mark">
      <!-- Skyline monogram: stylised skyline bars inside a rounded tile -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skyline logo">
        <defs>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#22D3EE" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#skyGrad)" />
        <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" />
        <!-- skyline bars -->
        <rect x="14" y="34" width="7" height="16" rx="1.5" fill="#04122B" />
        <rect x="24" y="26" width="7" height="24" rx="1.5" fill="#04122B" />
        <rect x="34" y="20" width="7" height="30" rx="1.5" fill="#04122B" />
        <rect x="44" y="30" width="7" height="20" rx="1.5" fill="#04122B" />
        <!-- accent dot -->
        <circle cx="47.5" cy="22" r="2.6" fill="#B2FF59" />
      </svg>
    </div>
    <h1 class="sky-brand-name">Skyline</h1>
  </div>

  <!-- ============================================================
       REFERRAL CHIP — dynamic, populated from ?ref= in the URL
       ============================================================ -->
  <div class="sky-ref" id="skyRefChip" hidden>
    <span class="sky-ref-dot"></span>
    Referred by <b id="skyRefCode">—</b>
    <i class="fas fa-lock"></i>
  </div>

  <!-- Simpler welcome note -->
  <p class="sky-welcome">Welcome to <b>Skyline</b> — focused investments, For Africans.</p>

  <!-- ============================================================
       CARD
       ============================================================ -->
  <div class="sky-card">

    <!-- Switcher — data-form / data-active contract preserved -->
    <div class="sky-tabs" id="pulseSwitch" data-active="login">
      <button type="button" class="sky-tab active" data-form="login">Sign in</button>
      <button type="button" class="sky-tab"        data-form="register">Create account</button>
    </div>

    <!-- ============================================================
         SIGN-IN FORM (IDs unchanged)
         ============================================================ -->
    <form class="sky-form active" id="loginForm" novalidate>

      <div class="sky-field">
        <label class="sky-label" for="loginPhone">Phone number</label>
        <div class="sky-input-wrap">
          <input type="tel"
                 class="sky-input pulse-input"
                 id="loginPhone"
                 placeholder="+256 7000000000"
                 autocomplete="tel"
                 inputmode="tel"
                 required />
        </div>
      </div>

      <div class="sky-field">
        <label class="sky-label" for="loginPin">PIN</label>
        <div class="sky-input-wrap">
          <input type="password"
                 class="sky-input pulse-input"
                 id="loginPin"
                 placeholder="55555"
                 maxlength="5"
                 inputmode="numeric"
                 pattern="[0-9]{5}"
                 autocomplete="current-password"
                 required />
          <button type="button"
                  class="sky-eye pulse-eye"
                  data-target="loginPin"
                  aria-label="Show PIN">
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="sky-submit pulse-submit">
        <span>Sign in</span>
      </button>

      <p class="sky-foot">
        New to Skyline?
        <a href="#" data-switch="register">Create Account</a>
      </p>
    </form>

    <!-- ============================================================
         CREATE-ACCOUNT FORM (IDs unchanged)
         ============================================================ -->
    <form class="sky-form" id="registerForm" novalidate>

      <div class="sky-field">
        <label class="sky-label" for="regUsername">Investor name</label>
        <div class="sky-input-wrap">
          <input type="text"
                 class="sky-input pulse-input"
                 id="regUsername"
                 placeholder="your name"
                 autocomplete="username"
                 required />
        </div>
      </div>

      <div class="sky-field">
        <label class="sky-label" for="regPhone">Phone number</label>
        <div class="sky-input-wrap">
          <input type="tel"
                 class="sky-input pulse-input"
                 id="regPhone"
                 placeholder="+256 7XX XXX XXX"
                 autocomplete="tel"
                 inputmode="tel"
                 required />
        </div>
      </div>

      <div class="sky-field">
        <label class="sky-label" for="regPin">Create PIN</label>
        <div class="sky-input-wrap">
          <input type="password"
                 class="sky-input pulse-input"
                 id="regPin"
                 placeholder="55555"
                 maxlength="5"
                 inputmode="numeric"
                 pattern="[0-9]{5}"
                 autocomplete="new-password"
                 required />
          <button type="button"
                  class="sky-eye pulse-eye"
                  data-target="regPin"
                  aria-label="Show PIN">
            <i class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="sky-field">
        <label class="sky-label" for="regReferral">
          Invite code <span class="sky-opt">optional</span>
        </label>
        <div class="sky-input-wrap">
          <input type="text"
                 class="sky-input pulse-input"
                 id="regReferral"
                 placeholder="Enter invite code"
                 autocomplete="off" />
        </div>
      </div>

      <button type="submit" class="sky-submit pulse-submit">
        <span>Create account</span>
      </button>

      <p class="sky-foot">
        Already a member?
        <a href="#" data-switch="login">Sign in</a>
      </p>
    </form>

    <!-- ============================================================
         COMMUNITY — icon logos with hyperlinks (no button rows)
         ============================================================ -->
    <div class="sky-community">
      <span class="sky-community-label">Join our Groups from here</span>
      <div class="sky-social-icons">
        <a class="sky-social-icon sky-wa"
           href=""
           target="_blank" rel="noopener"
           aria-label="Join Skyline on WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
        <a class="sky-social-icon sky-tg"
           href=""
           target="_blank" rel="noopener"
           aria-label="Join Skyline on Telegram">
          <i class="fab fa-telegram"></i>
        </a>
      </div>
    </div>
  </div>

  <p class="sky-legal">© 2026 Skyline · Invest with clarity</p>
</div>

<!-- ============================================================
     LEGACY HOOKS — unchanged
     ============================================================ -->
<div id="pulseLegacyHooks" hidden>
  <div id="whatsappModal"></div>
  <div id="telegramModal"></div>
  <div id="facebookModal"></div>
  <span id="authStatus"></span>
  <div id="authError"></div>
  <input id="referralCode" type="text" readonly />
  <span id="userPreference"></span>
  <span id="appVersion"></span>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
