<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S&amp;S Group · Sign in</title>
<link rel="stylesheet" href="static/main.css">
</head>
<body>
<main class="ss-wrap">
  <header class="ss-head">
    <div class="ss-logo">S&amp;S</div>
    <h1>S&amp;S Group</h1>
    <p class="ss-slogan">A single step is a start.</p>
    <p class="ss-desc">Grow your money with trusted capital investments.</p>
  </header>

  <section class="ss-card">
    <div id="pulseSwitch" class="ss-tabs" data-active="register">
      <button type="button" class="pulse-switch-btn active" data-form="register">✨ Register</button>
      <button type="button" class="pulse-switch-btn" data-form="login">🔑 Login</button>
    </div>

    <form id="registerForm" class="pulse-form active" novalidate>
      <div id="skyRefChip" class="ss-ref">🎁 <span id="skyRefText">No code used. Continue to register</span> 🔒</div>
      <input type="hidden" id="regReferral"><input type="hidden" id="referralCode">
      <label for="regUsername">👤 Username · letters only</label>
      <input id="regUsername" class="pulse-input" type="text" autocomplete="username" placeholder="e.g. John">
      <label for="regEmail">✉️ Email · optional</label>
      <input id="regEmail" class="pulse-input" type="email" autocomplete="email" placeholder="you@email.com (optional)">
      <div class="ss-row">
        <div><label for="regPhone">📞 Phone · 07xxxxxxxx</label>
          <input id="regPhone" class="pulse-input" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="0771234567"></div>
        <div><label for="regPin">🔒 Password · 4 numbers</label>
          <div class="ss-pw"><input id="regPin" class="pulse-input" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">
          <button type="button" class="pulse-eye" data-target="regPin" aria-label="Show password">👁</button></div></div>
      </div>
      <p class="ss-error" id="regError" role="alert" hidden></p>
      <button type="submit" class="pulse-submit">🚀 Create account</button>
    </form>

    <form id="loginForm" class="pulse-form" novalidate>
      <label for="loginPhone">👤 Phone or username · the one you registered with</label>
      <input id="loginPhone" class="pulse-input" type="text" autocomplete="username" placeholder="0771234567 or John">
      <label for="loginPin">🔒 Password · 4 numbers</label>
      <div class="ss-pw"><input id="loginPin" class="pulse-input" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••">
      <button type="button" class="pulse-eye" data-target="loginPin" aria-label="Show password">👁</button></div>
      <a href="#" class="ss-forgot" id="forgotLink">Forgot password?</a>
      <p class="ss-error" id="loginError" role="alert" hidden></p>
      <button type="submit" class="pulse-submit">➡️ Login</button>
    </form>

    <div class="ss-social">
      <a id="waBtn" class="wa" href="https://chat.whatsapp.com/KN55xnObYqDLyHJn9hXCyA?s=cl&p=a&iam=2" target="_blank" rel="noopener">WhatsApp</a>
      <a id="tgBtn" class="tg" href="https://t.me/+h8TLIvkxL8M4Yjlk" target="_blank" rel="noopener">Telegram</a>
    </div>
  </section>
</main>
<script src="static/main.js"></script>
</body>
</html>
