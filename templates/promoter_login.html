<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>express · Promoter Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ============================================================
           express - PROMOTER LOGIN
           Dark + Gold Theme · Premium · Mobile-First
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --express-bg: #0D0D0D;
            --express-surface: #1A1A1A;
            --express-card: #1E1E1E;
            --express-card-border: #2A2A2A;
            --express-gold: #F5A623;
            --express-gold-dark: #D4891A;
            --express-gold-glow: rgba(245, 166, 35, 0.15);
            --express-white: #FFFFFF;
            --express-grey: #B0B0B0;
            --express-muted: #6B6B6B;
            --express-green: #10B981;
            --express-red: #E7242A;
            --express-radius: 20px;
            --express-radius-sm: 12px;
            --express-radius-pill: 50px;
            --express-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --express-shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.6);
            --express-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            font-family: var(--express-font);
            background: var(--express-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Background Glow */
        body::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ============================================================
           LOGIN CARD
           ============================================================ */
        .express-login-card {
            max-width: 440px;
            width: 100%;
            background: var(--express-card);
            border-radius: var(--express-radius);
            padding: 32px 28px 28px;
            border: 1px solid var(--express-card-border);
            box-shadow: var(--express-shadow);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .express-login-card:hover {
            box-shadow: var(--express-shadow-hover);
        }

        /* ============================================================
           BRAND
           ============================================================ */
        .express-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .express-brand-icon {
            width: 48px;
            height: 48px;
            background: var(--express-gold);
            border-radius: var(--express-radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: var(--express-bg);
            box-shadow: 0 0 30px var(--express-gold-glow);
        }

        .express-brand-name {
            font-size: 28px;
            font-weight: 900;
            color: var(--express-white);
            letter-spacing: -0.5px;
        }

        .express-brand-name span {
            color: var(--express-gold);
        }

        .express-brand-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: var(--express-radius-pill);
            background: rgba(245, 166, 35, 0.12);
            color: var(--express-gold);
            border: 1px solid rgba(245, 166, 35, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .express-login-header {
            text-align: center;
            margin: 12px 0 24px;
        }

        .express-login-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--express-white);
        }

        .express-login-sub {
            font-size: 13px;
            color: var(--express-grey);
            margin-top: 2px;
        }

        .express-login-sub strong {
            color: var(--express-gold);
        }

        /* ============================================================
           DIVIDER
           ============================================================ */
        .express-divider {
            height: 2px;
            width: 40px;
            background: var(--express-gold);
            margin: 0 auto 24px;
            border-radius: 4px;
            opacity: 0.4;
        }

        /* ============================================================
           FORM
           ============================================================ */
        .express-form-group {
            margin-bottom: 16px;
        }

        .express-form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--express-grey);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .express-form-label i {
            color: var(--express-gold);
            margin-right: 6px;
        }

        .express-form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--express-card-border);
            border-radius: var(--express-radius-sm);
            background: var(--express-bg);
            color: var(--express-white);
            font-size: 15px;
            font-family: var(--express-font);
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        .express-form-input:focus {
            border-color: var(--express-gold);
            box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.06);
        }

        .express-form-input::placeholder {
            color: var(--express-muted);
            font-weight: 400;
            font-size: 14px;
        }

        /* ============================================================
           PASSWORD WRAPPER
           ============================================================ */
        .express-pwd-wrap {
            position: relative;
        }

        .express-pwd-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--express-muted);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 4px;
        }

        .express-pwd-toggle:hover {
            color: var(--express-gold);
        }

        /* ============================================================
           FORGOT PASSWORD
           ============================================================ */
        .express-forgot-row {
            text-align: right;
            margin-top: 4px;
        }

        .express-forgot-btn {
            background: none;
            border: none;
            color: var(--express-grey);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
            font-family: var(--express-font);
            padding: 4px 0;
        }

        .express-forgot-btn:hover {
            color: var(--express-gold);
        }

        /* ============================================================
           SUBMIT BUTTON
           ============================================================ */
        .express-submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--express-radius-pill);
            background: var(--express-gold);
            color: var(--express-bg);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--express-font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .express-submit-btn:hover {
            background: var(--express-gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.25);
        }

        .express-submit-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .express-submit-btn i {
            font-size: 16px;
        }

        /* ============================================================
           ERROR MESSAGE
           ============================================================ */
        .express-error-msg {
            background: rgba(231, 36, 42, 0.08);
            color: var(--express-red);
            padding: 10px 16px;
            border-radius: var(--express-radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            display: none;
            border: 1px solid rgba(231, 36, 42, 0.15);
            align-items: center;
            gap: 8px;
        }

        .express-error-msg i {
            font-size: 16px;
        }

        .express-error-msg.show {
            display: flex;
        }

        /* ============================================================
           SUCCESS MESSAGE
           ============================================================ */
        .express-success-msg {
            background: rgba(16, 185, 129, 0.08);
            color: var(--express-green);
            padding: 10px 16px;
            border-radius: var(--express-radius-sm);
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.15);
            align-items: center;
            gap: 8px;
        }

        .express-success-msg i {
            font-size: 16px;
        }

        .express-success-msg.show {
            display: flex;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .express-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--express-card-border);
        }

        .express-footer-text {
            font-size: 11px;
            color: var(--express-muted);
        }

        .express-footer-text span {
            color: var(--express-gold);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .express-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: var(--express-radius-pill);
            background: var(--express-card);
            color: var(--express-white);
            font-weight: 600;
            font-size: 13px;
            border: 1px solid var(--express-card-border);
            box-shadow: var(--express-shadow-hover);
            text-align: center;
            max-width: 90vw;
            font-family: var(--express-font);
            animation: expressToastUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .express-toast.success {
            border-color: var(--express-green);
        }

        .express-toast.error {
            border-color: var(--express-red);
        }

        .express-toast.warning {
            border-color: var(--express-gold);
        }

        @keyframes expressToastUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        @keyframes expressToastDown {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.9);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .express-login-card {
                padding: 24px 20px;
                border-radius: var(--express-radius-sm);
            }

            .express-brand-name {
                font-size: 22px;
            }

            .express-brand-icon {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .express-login-title {
                font-size: 17px;
            }

            .express-login-sub {
                font-size: 12px;
            }

            .express-form-input {
                font-size: 14px;
                padding: 12px 14px;
            }

            .express-submit-btn {
                font-size: 14px;
                padding: 12px;
            }

            .express-brand-badge {
                font-size: 8px;
                padding: 1px 10px;
            }
        }

        @media (min-width: 601px) {
            .express-login-card {
                padding: 40px 36px 32px;
            }

            .express-brand-name {
                font-size: 32px;
            }

            .express-brand-icon {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .express-login-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="express-login-card" role="main" aria-label="express promoter login">

        <!-- ============================================================
        BRAND
        ============================================================ -->
        <div class="express-brand">
            <div class="express-brand-icon">27</div>
            <div class="express-brand-name">HUT<span>27</span></div>
            <span class="express-brand-badge">Promoter</span>
        </div>

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <div class="express-login-header">
            <h1 class="express-login-title">Welcome Back</h1>
            <p class="express-login-sub">
                Access your <strong>promoter</strong> dashboard
            </p>
        </div>

        <div class="express-divider"></div>

        <!-- ============================================================
        FORM
        ============================================================ -->
        <form id="loginForm" autocomplete="off">

            <!-- Phone -->
            <div class="express-form-group">
                <label class="express-form-label" for="phone">
                    <i class="fas fa-phone-alt"></i> Phone Number
                </label>
                <input type="tel"
                       class="express-form-input"
                       id="phone"
                       placeholder="256... or 07..."
                       value="256700000000"
                       required />
            </div>

            <!-- Password -->
            <div class="express-form-group">
                <label class="express-form-label" for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="express-pwd-wrap">
                    <input type="password"
                           class="express-form-input"
                           id="password"
                           placeholder="Enter your password"
                           value="xxxxxxxxxxxx"
                           required />
                    <button type="button"
                            class="express-pwd-toggle"
                            id="pwdToggle"
                            aria-label="Toggle password visibility">
                        <i class="far fa-eye" id="pwdIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="express-forgot-row">
                <button type="button" class="express-forgot-btn" id="forgotPasswordBtn">
                    Forgot password?
                </button>
            </div>

            <!-- Submit -->
            <button type="submit" class="express-submit-btn" id="loginBtn">
                <i class="fas fa-arrow-right"></i> Sign In
            </button>

            <!-- Error Message -->
            <div id="errorMessage" class="express-error-msg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="express-success-msg">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

        </form>

        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <div class="express-footer">
            <p class="express-footer-text">
                © 2026 <span>express</span> · Built for Ugandans
            </p>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
  (function() {
    "use strict";

    // ============================================================
    // DOM REFS
    // ============================================================
    const form = document.getElementById('loginForm');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const pwdToggle = document.getElementById('pwdToggle');
    const pwdIcon = document.getElementById('pwdIcon');
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successDiv = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    const forgotBtn = document.getElementById('forgotPasswordBtn');
    const loginBtn = document.getElementById('loginBtn');

    // ============================================================
    // TOAST SYSTEM
    // ============================================================
    function showToast(message, type = 'info', duration = 4000) {
        const old = document.querySelector('.express-toast');
        if (old) old.remove();

        const toast = document.createElement('div');
        toast.className = `express-toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
            toast.style.animation = 'expressToastDown 0.3s ease-out';
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // ============================================================
    // PASSWORD TOGGLE
    // ============================================================
    if (pwdToggle) {
        pwdToggle.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            pwdIcon.className = isPassword ? 'far fa-eye-slash' : 'far fa-eye';
        });
    }

    // ============================================================
    // SHOW/HIDE MESSAGES
    // ============================================================
    function showError(msg) {
        if (errorText) errorText.textContent = msg;
        if (errorDiv) errorDiv.classList.add('show');
        if (successDiv) successDiv.classList.remove('show');
    }

    function showSuccess(msg) {
        if (successText) successText.textContent = msg;
        if (successDiv) successDiv.classList.add('show');
        if (errorDiv) errorDiv.classList.remove('show');
    }

    function hideMessages() {
        if (errorDiv) errorDiv.classList.remove('show');
        if (successDiv) successDiv.classList.remove('show');
    }

    // ============================================================
    // SET LOADING STATE
    // ============================================================
    function setLoading(isLoading) {
        if (!loginBtn) return;
        
        if (isLoading) {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        } else {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Sign In';
        }
    }

    // ============================================================
    // LOGIN HANDLER - Live Backend Integration
    // ============================================================
    async function handleLogin(e) {
        e.preventDefault();
        hideMessages();

        const rawPhone = phoneInput?.value?.trim() || '';
        const password = passwordInput?.value?.trim() || '';

        // ============================================================
        // VALIDATION
        // ============================================================
        if (!rawPhone) {
            showError('Please enter your phone number.');
            phoneInput?.focus();
            return;
        }

        if (!password) {
            showError('Please enter your password.');
            passwordInput?.focus();
            return;
        }

        // ============================================================
        // FORMAT PHONE NUMBER FOR BACKEND
        // ============================================================
        let formattedPhone = rawPhone.replace(/\s/g, '');
        
        // Remove leading + if present
        if (formattedPhone.startsWith('+')) {
            formattedPhone = formattedPhone.slice(1);
        }
        
        // If starts with 0, replace with 256
        if (formattedPhone.startsWith('0')) {
            formattedPhone = '256' + formattedPhone.slice(1);
        }
        
        // If starts with 256 but no +, keep as is
        // If shorter than 10 digits, it might be invalid
        if (formattedPhone.length < 10) {
            showError('Please enter a valid phone number.');
            return;
        }

        // ============================================================
        // SET LOADING STATE
        // ============================================================
        setLoading(true);

        try {
            // ============================================================
            // API CALL TO BACKEND
            // ============================================================
            const response = await fetch('/promoter/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({
                    phone: formattedPhone,
                    password: password
                }),
                credentials: 'include'
            });

            // ============================================================
            // PARSE RESPONSE
            // ============================================================
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || data.error || 'Login failed');
            }

            // ============================================================
            // SUCCESS
            // ============================================================
            console.log('✅ Login successful:', data);
            
            showSuccess('✅ Login successful! Redirecting...');

            // Store promoter data in session (for page access)
            if (data.promoter || data.user) {
                const promoterData = data.promoter || data.user;
                sessionStorage.setItem('express_promoter', JSON.stringify(promoterData));
                sessionStorage.setItem('express_login_time', new Date().toISOString());
            }

            // Redirect to promoter dashboard
            setTimeout(() => {
                window.location.href = '/promoter/dashboard';
            }, 1200);

        } catch (error) {
            // ============================================================
            // ERROR HANDLING
            // ============================================================
            console.error('❌ Login error:', error);
            
            let errorMessage = error.message || 'Login failed. Please try again.';
            
            // Specific error messages
            if (errorMessage.includes('not found') || errorMessage.includes('invalid')) {
                errorMessage = 'Phone number not found. Please contact admin.';
            } else if (errorMessage.includes('password') || errorMessage.includes('PIN')) {
                errorMessage = 'Incorrect password. Please try again.';
            } else if (errorMessage.includes('inactive') || errorMessage.includes('disabled')) {
                errorMessage = 'Your account is inactive. Please contact admin.';
            }
            
            showError(errorMessage);
            
        } finally {
            // ============================================================
            // RESET LOADING STATE
            // ============================================================
            setLoading(false);
        }
    }

    // ============================================================
    // FORGOT PASSWORD
    // ============================================================
    function handleForgotPassword() {
        showToast('📧 Please contact admin to reset your password.', 'warning', 4000);
    }

    // ============================================================
    // ENTER KEY SUPPORT ON INPUTS
    // ============================================================
    function handleEnterKey(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            loginBtn?.click();
        }
    }

    // ============================================================
    // ATTACH EVENTS
    // ============================================================
    if (form) {
        form.addEventListener('submit', handleLogin);
    }

    if (forgotBtn) {
        forgotBtn.addEventListener('click', handleForgotPassword);
    }

    if (phoneInput) {
        phoneInput.addEventListener('keydown', handleEnterKey);
    }

    if (passwordInput) {
        passwordInput.addEventListener('keydown', handleEnterKey);
    }

    // ============================================================
    // DEMO: Auto-fill for testing (remove in production)
    // ============================================================
    // Uncomment to pre-fill for testing
    // if (phoneInput && !phoneInput.value) {
    //     phoneInput.value = '256740587928';
    // }
    // if (passwordInput && !passwordInput.value) {
    //     passwordInput.value = 'express@2026';
    // }

    console.log('🏠 express Promoter Login Ready');
    console.log('🔗 Backend endpoint: /promoter/login');
})();
    </script>

</body>
</html>
